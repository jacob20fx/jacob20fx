<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>jacob20fx — panel administratora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg"></div>
  <header class="nav shell"><a class="brand" href="index.html"><span class="brand-mark">J20</span><span>jacob20fx</span></a><a class="ghost" href="index.html">Powrót</a></header>
  <main class="shell admin-main">
    <section id="login" class="panel login">
      <span class="eyebrow">PANEL ADMINISTRATORA</span><h1>Logowanie</h1>
      <p>Zaloguj się kontem administratora utworzonym w Supabase.</p>
      <form id="loginForm"><label><span>E-mail</span><input id="email" type="email" required></label><label><span>Hasło</span><input id="password" type="password" required></label><button class="primary full">Zaloguj</button></form>
      <p id="loginMessage" class="message"></p>
    </section>
    <section id="dashboard" class="hidden">
      <div class="dashboard-head"><div><span class="eyebrow">PANEL ADMINISTRATORA</span><h1>Zgłoszenia</h1></div><button id="logout" class="ghost">Wyloguj</button></div>
      <div id="stats" class="stats"></div>
      <div id="applications" class="cards"></div>
      <p id="empty" class="empty hidden">Brak zgłoszeń.</p>
    </section>
  </main>
  <script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
